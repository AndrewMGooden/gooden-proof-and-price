name: Build Android APK

# Builds a signed, installable APK and attaches it to a GitHub Release,
# so it can be downloaded straight onto a phone.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "twa-manifest.json"
      - "icon-*.png"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The runner already ships the Android SDK. The setup-android action
      # fails trying to install the long-removed "tools" package, so use the
      # preinstalled SDK directly and just accept the licences.
      - name: Use the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK at: $ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ls "$ANDROID_SDK_ROOT"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.22.0

      # Reuse the saved signing key when one exists, otherwise make a throwaway.
      # A throwaway key still installs fine, but a later build signed with a
      # different key cannot update it — Android treats that as a different app.
      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "pass=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "Using the saved signing key."
          else
            PASS="proofandprice"
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias proofandprice \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Gooden's Proof and Price, O=AndrewMGooden, L=Negril, C=JM"
            echo "pass=$PASS" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "No saved key found, generated a throwaway one."
          fi

      - name: Stamp the version from the run number
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.appVersionCode = Number(process.env.GITHUB_RUN_NUMBER);
            m.appVersionName = "1.0." + process.env.GITHUB_RUN_NUMBER;
            m.appVersion = m.appVersionName;
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
          '

      - name: Point Bubblewrap at the preinstalled JDK and SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          { "jdkPath": "$JAVA_HOME", "androidSdkPath": "$ANDROID_SDK_ROOT" }
          EOF

      # twa-manifest.json holds the config; updateProject turns it into a real
      # Android project, then build runs Gradle over it.
      - name: Generate the Android project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ steps.key.outputs.pass }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ steps.key.outputs.pass }}
        run: |
          bubblewrap help || true
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          ls -la

      # Bubblewrap's own build step rejects the runner's SDK layout — it looks
      # for the legacy tools/ folder Google removed. The project it generated
      # is a normal Gradle project, so build and sign it directly.
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          find . -name "*.apk" -path "*/outputs/*"

      - name: Sign the APK
        env:
          PASS: ${{ steps.key.outputs.pass }}
        run: |
          BT=$(ls -1 "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          echo "Using build-tools $BT"
          UNSIGNED=$(find . -path "*/outputs/apk/release/*.apk" | head -1)
          echo "Unsigned APK: $UNSIGNED"
          mkdir -p dist
          "$ANDROID_SDK_ROOT/build-tools/$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" sign \
            --ks android.keystore \
            --ks-key-alias proofandprice \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --out "dist/gooden-proof-and-price.apk" \
            aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify --print-certs dist/gooden-proof-and-price.apk
          ls -la dist

      # Needed at /.well-known/assetlinks.json on the site, otherwise the app
      # runs with a browser address bar pinned across the top.
      - name: Write assetlinks.json
        env:
          PASS: ${{ steps.key.outputs.pass }}
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias proofandprice \
                -storepass "$PASS" | grep -m1 "SHA256:" | awk '{print $2}')
          echo "Fingerprint: $FP"
          cat > dist/assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "io.github.andrewmgooden.proofandprice",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          EOF
          cat dist/assetlinks.json

      # Private to repo collaborators — never attached to the public release.
      - name: Keep the signing key as a private artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-KEEP-THIS-SAFE
          path: android.keystore
          retention-days: 90

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Proof and Price 1.0.${{ github.run_number }}
          body: |
            Android app for Gooden's Proof and Price.

            **Install:** download the `.apk` below on your phone, tap it, and
            allow installs from unknown sources when prompted.

            Stable signing key in use: ${{ steps.key.outputs.stable }}
          files: |
            dist/*.apk
            dist/assetlinks.json
